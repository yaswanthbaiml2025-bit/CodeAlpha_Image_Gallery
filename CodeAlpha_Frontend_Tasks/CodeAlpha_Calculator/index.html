<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive calculator built for the CodeAlpha frontend internship.">
  <title>Calculator | CodeAlpha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="calculator" aria-label="Calculator">
      <p class="eyebrow">CODEALPHA · TASK 2</p>
      <h1>Calculator</h1>
      <div class="display" aria-live="polite">
        <div id="previous" class="previous"></div>
        <output id="current" class="current">0</output>
      </div>
      <div class="keys">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="delete">DEL</button>
        <button class="key operator" data-operator="/">÷</button>
        <button class="key operator" data-operator="*">×</button>

        <button class="key" data-number="7">7</button>
        <button class="key" data-number="8">8</button>
        <button class="key" data-number="9">9</button>
        <button class="key operator" data-operator="-">−</button>

        <button class="key" data-number="4">4</button>
        <button class="key" data-number="5">5</button>
        <button class="key" data-number="6">6</button>
        <button class="key operator" data-operator="+">+</button>

        <button class="key" data-number="1">1</button>
        <button class="key" data-number="2">2</button>
        <button class="key" data-number="3">3</button>
        <button class="key equals" data-action="equals">=</button>

        <button class="key zero" data-number="0">0</button>
        <button class="key" data-number=".">.</button>
      </div>
      <p class="hint">Keyboard supported · Enter = · Backspace = delete · Esc = clear</p>
    </section>
    <footer>Built with HTML, CSS and JavaScript · CodeAlpha Frontend Internship</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
