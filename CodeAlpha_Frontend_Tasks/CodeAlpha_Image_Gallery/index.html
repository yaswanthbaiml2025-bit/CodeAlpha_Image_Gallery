<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive image gallery built for the CodeAlpha frontend internship.">
  <title>Image Gallery | CodeAlpha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#">Frame<span>Gallery</span></a>
    <p>Moments worth remembering</p>
  </header>

  <main class="container">
    <section class="intro">
      <p class="eyebrow">CODEALPHA · TASK 1</p>
      <h1>Explore the gallery</h1>
      <p>Browse a small collection of travel and nature photography.</p>
    </section>

    <nav class="filters" aria-label="Filter images">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="nature">Nature</button>
      <button class="filter-btn" data-filter="travel">Travel</button>
      <button class="filter-btn" data-filter="architecture">Architecture</button>
    </nav>

    <section id="gallery" class="gallery" aria-label="Photo gallery">
      <button class="photo-card" data-category="nature" data-title="Mountain morning">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=85" alt="Snow-capped mountain peaks">
        <span>Mountain morning</span>
      </button>
      <button class="photo-card" data-category="travel" data-title="Coastal escape">
        <img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=85" alt="Ocean waves along a coast">
        <span>Coastal escape</span>
      </button>
      <button class="photo-card" data-category="architecture" data-title="City lines">
        <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=900&q=85" alt="Modern architectural building">
        <span>City lines</span>
      </button>
      <button class="photo-card" data-category="nature" data-title="Forest path">
        <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=900&q=85" alt="Sunlight through a green forest">
        <span>Forest path</span>
      </button>
      <button class="photo-card" data-category="travel" data-title="Quiet streets">
        <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=900&q=85" alt="Beautiful town at dusk">
        <span>Quiet streets</span>
      </button>
      <button class="photo-card" data-category="architecture" data-title="Urban geometry">
        <img src="https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=900&q=85" alt="White modern building against the sky">
        <span>Urban geometry</span>
      </button>
      <button class="photo-card" data-category="nature" data-title="Desert light">
        <img src="https://images.unsplash.com/photo-1509316785289-025f5b846b35?auto=format&fit=crop&w=900&q=85" alt="Sand dunes in warm sunlight">
        <span>Desert light</span>
      </button>
      <button class="photo-card" data-category="travel" data-title="Alpine lake">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=85" alt="Mountain lake and green landscape">
        <span>Alpine lake</span>
      </button>
      <button class="photo-card" data-category="architecture" data-title="Old-world detail">
        <img src="https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=900&q=85" alt="Distinctive city architecture">
        <span>Old-world detail</span>
      </button>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" id="closeLightbox" aria-label="Close image viewer">&times;</button>
    <button class="lightbox-nav prev" id="prevImage" aria-label="Previous image">&#10094;</button>
    <figure>
      <img id="lightboxImage" src="" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
    <button class="lightbox-nav next" id="nextImage" aria-label="Next image">&#10095;</button>
  </div>

  <footer>Built with HTML, CSS and JavaScript · CodeAlpha Frontend Internship</footer>
  <script src="script.js"></script>
</body>
</html>
